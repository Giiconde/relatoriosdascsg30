        // Render Schedule Blocks
        function renderSchedule() {
            const currentName = getCSName();
            const activeSchedule = schedules[currentName] || defaultSchedule;

            DOM.scheduleContainer.innerHTML = activeSchedule.map(block => {
                let borderClass = 'border-gray-400 bg-gray-50';
                if (block.type === 'block') borderClass = 'border-[#a55e9d]';
                else if (block.type === 'break') borderClass = 'border-pink-200 bg-pink-50';
                
                const titleClass = block.type === 'milestone' ? 'text-sm' : 'text-base';

                return `
                    <div class="p-4 rounded-xl border-l-4 shadow-sm bg-white transition-all ${borderClass}">
                        <div class="text-xs font-bold text-gray-500 mb-1">${block.time}</div>
                        <div class="font-medium ${titleClass}">
                            ${block.title}
                        </div>
                    </div>
                `;
